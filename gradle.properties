# Gradle JVM. 2 GB is above the 1 GB daemon floor and leaves headroom for KSP without
# forcing a heap this machine may not have available to a second JVM.
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8

# AndroidX is required by essentially every modern library; opting out fails the build in
# a confusing way rather than the obvious way.
android.useAndroidX=true

# Kotlin's own incremental compilation, and KSP's.
kotlin.incremental=true
ksp.incremental=true

# Build only the resources for the ABIs actually shipped. All three are listed because the
# APK is distributed as one artifact; see app/build.gradle.kts for why no ABI split is
# configured (an ABI split would defeat the single-file distribution this project wants).
android.nonTransitiveRClass=true

# Parallel module execution is irrelevant with one module, but configuration cache is not:
# it is a measurable startup win on the low-end-machine CI this project targets.
org.gradle.configuration-cache=true
org.gradle.caching=true

# Jetifier is off because no dependency here predates AndroidX. Leaving it on costs build
# time and can rewrite bytecode unnecessarily.
android.enableJetifier=false
