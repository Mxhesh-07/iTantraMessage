# Gradle wrapper for iTantra Message.
#
# 8.14 is the version already unpacked in this machine's Gradle user home
# (~/.gradle/wrapper/dists/gradle-8.14-all/), so a first build does not download a
# 224 MB distribution. It is also the minimum Gradle that AGP 8.13.1 accepts, and AGP
# 8.13.1 is the newest Android Gradle Plugin in the local artifact cache -- so this pair
# is the newest combination that builds without a network fetch.
#
# -all, not -bin, and that is a deliberate concession to this machine rather than a
# preference: the local Gradle user home already has gradle-8.14-all unpacked, so -all makes
# the first build start immediately, while -bin would trigger a fresh ~100 MB download for
# a distribution that is otherwise byte-identical in behaviour. On a machine with no
# Gradle cache, -bin is the better choice and this line should change to
# gradle-8.14-bin.zip with no other edits.
#
# distributionSha256Sum is intentionally not set. Pinning it would catch a tampered or
# corrupted download, which is a real benefit, but the checksum has to be taken from a
# trusted source rather than copied from the file being verified, and there is no
# published checksum for this distribution on this machine to copy from. An unverified
# hash here is worse than no hash: it looks like a guarantee and is not one.
# docs/BUILD.md records how to add it properly.
distributionBase=GRADLE_USER_HOME
distributionPath=wrapper/dists
distributionUrl=https\://services.gradle.org/distributions/gradle-8.14-all.zip
networkTimeout=10000
validateDistributionUrl=true
zipStoreBase=GRADLE_USER_HOME
zipStorePath=wrapper/dists
