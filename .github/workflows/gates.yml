# Runs the same three gates the project already uses locally.
#
# WHY THIS EXISTS
# ---------------
# `check_offline.sh` and `check_docs.py` are gates, not documentation. A gate nobody runs is a
# comment. Both have been verified against negative controls -- each catches a deliberately
# broken input -- but until now they only ran when a human remembered, which is exactly the
# condition under which the no-INTERNET property quietly regresses.
#
# The test task is the same one the README documents. Nothing here is a new standard; this
# just makes the existing ones non-optional.

name: gates

on:
  push:
    branches: [ master, main ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle.kts', 'gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Write local.properties
        # gitignored on purpose, so it is absent here exactly as it is absent for any other
        # person who clones. Creating it proves the build does not secretly depend on a file
        # that only exists on the author's machine.
        run: |
          mkdir -p "$ANDROID_HOME"
          echo "sdk.dir=$ANDROID_HOME" > local.properties

      - name: Unit tests (debug and release variants)
        run: ./gradlew --no-daemon --console=plain testDebugUnitTest testReleaseUnitTest

      - name: Build release APK
        run: ./gradlew --no-daemon --console=plain assembleRelease

      - name: Documentation gate
        run: python scripts/check_docs.py --verbose

      - name: Offline gate (release APK has no INTERNET)
        run: bash scripts/check_offline.sh

      - name: Fail if any log line leaks a real device identifier
        # The repository deliberately publishes no Bluetooth MAC and no device serial; the
        # transcripts in docs/ use synthetic addresses. This keeps them synthetic.
        run: |
          if grep -rInE '\b([0-9A-Fa-f]{2}:){5}[0-9A-Fa-f]{2}\b' \
               --include='*.md' --include='*.kt' . \
             | grep -vE '00:11:22:33:44:55|AA:BB:CC:DD:EE:FF'; then
            echo "::error::a real-looking MAC address is present in the repository"
            exit 1
          fi

      - name: R8 is actually enabled, and the speech model is packaged exactly once
        # WHAT CHANGED AND WHY
        # -----------------------
        # This step used to be a single line: assert the release APK is under 4 MiB, on the
        # reasoning that "if minification silently switches off, the APK grows by an order of
        # magnitude". That heuristic stopped working the moment a 153 MB Whisper model was
        # bundled into the APK, because the size is now dominated by an asset that R8 does not
        # touch. Switching minification off no longer produces an order-of-magnitude change --
        # it produces a few megabytes. The old check would have failed on the correct build and
        # stayed silent on the broken one, which is the worst combination a gate can have.
        #
        # So the property is asserted directly instead of being inferred from a number:
        #   1. isMinifyEnabled is genuinely true in the release build type.
        #   2. Each model file appears exactly once in the APK. Duplicated assets are the
        #      realistic way this artifact doubles, and this catches it.
        #   3. A loose absolute ceiling, as a backstop against anything unanticipated.
        run: |
          set -eu
          apk=app/build/outputs/apk/release/app-release.apk

          if ! grep -A6 'release {' app/build.gradle.kts | grep -q 'isMinifyEnabled = true'; then
            echo '::error::isMinifyEnabled is not true in the release build type'
            exit 1
          fi
          echo 'R8 minification is enabled'

          for f in base-encoder.int8.onnx base-decoder.int8.onnx base-tokens.txt; do
            n=$(unzip -l "$apk" | grep -c "$f" || true)
            if [ "$n" -ne 1 ]; then
              echo "::error::$f appears $n times in the release APK, expected exactly 1"
              exit 1
            fi
          done
          echo 'each speech model file is packaged exactly once'

          # 320 MiB. The model plus the two native libraries is ~186 MiB stored uncompressed;
          # this leaves room for app code and resources to grow without tripping, and is still
          # far below the ~2x that an accidental second copy of the model would produce.
          size=$(stat -c%s "$apk")
          echo "release APK: $size bytes"
          if [ "$size" -gt 335544320 ]; then
            echo "::error::release APK is $size bytes, expected under 320 MiB"
            exit 1
          fi

      - name: The model files are byte-exact in the checkout
        # WHY THIS EXISTS
        # -------------
        # `.gitattributes` had a blanket `*.txt text eol=crlf` rule. That is correct for prose
        # and it silently corrupted `base-tokens.txt`: the file has 50,257 lines, so a CRLF
        # checkout rewrites it from 816,730 bytes to 866,987. The blob in git was fine, the
        # file in the author's working copy was fine, and `assembleRelease` succeeded --
        # so every local check passed while every fresh clone received a tokens file that
        # `ModelStore` rejects on SHA-256. On a clean clone the app would extract the model,
        # fail verification, discard it as corrupt, and have no speech engine at all.
        #
        # The failure was only found by cloning the published repository and comparing sizes.
        # This step makes that check routine, and it checks the *checked-out* bytes rather
        # than the blob, because the blob was never the thing that was wrong.
        #
        # The expected values are duplicated from ModelStore.EXPECTED on purpose. If they
        # diverge, this gate fails and someone reads the diff -- which is the correct outcome
        # for a model hash that changed without anyone meaning it to.
        run: |
          set -eu
          dir=app/src/main/assets/models/whisper-base
          check() {
            actual=$(sha256sum "$dir/$1" | cut -d' ' -f1)
            actual_size=$(stat -c%s "$dir/$1")
            if [ "$actual" != "$2" ] || [ "$actual_size" != "$3" ]; then
              echo "::error::$1 is $actual_size bytes / $actual"
              echo "::error::expected $3 bytes / $2"
              echo '::error::A mismatch here means a fresh clone cannot load the model.'
              echo '::error::Check .gitattributes for an end-of-line rule touching this file.'
              exit 1
            fi
            echo "$1 ok ($actual_size bytes)"
          }
          check base-tokens.txt   b34b360dbb493e781e479794586d661700670d65564001f23024971d1f2fa126 816730
          check base-encoder.int8.onnx 0b8fb1304b6109976038efff5ace81720e00386f3ff6b54ee8c75291ca0a1e11 29120534
          check base-decoder.int8.onnx 9759d217388a01b3a4c7c15533201067b48ae819c4daafc8624e64b9409dc02d 130672026

      - name: The committed .docx matches its Markdown source
        # The presentation pack is submitted as a Word document, and it was previously built by
        # hand. It drifted: the Markdown was corrected several times while the .docx kept
        # describing an older version of the project, including before offline speech-to-text
        # existed at all. Nothing noticed, because nothing compared the two.
        #
        # `make_docx.py` writes a ZIP with fixed member timestamps, so an unchanged source
        # produces a byte-identical file and `git diff --exit-code` is a valid freshness check.
        run: |
          set -eu
          python scripts/make_docx.py
          if ! git diff --exit-code --quiet -- docs/PRESENTATION.docx; then
            echo '::error::docs/PRESENTATION.docx is stale.'
            echo '::error::Run: python scripts/make_docx.py && git add docs/PRESENTATION.docx'
            exit 1
          fi
          echo 'PRESENTATION.docx is current'

      - name: Every APK size quoted in the docs is the real one
        # This exists because the docs were wrong. Six files quoted an APK size, the number
        # drifted as the build changed, and nothing noticed: the size was a hand-copied figure
        # with no gate behind it. A reader comparing the README against a fresh build would
        # have found a mismatch, which is exactly the kind of small inaccuracy that makes a
        # project read as careless rather than rigorous.
        #
        # The rule is stricter than "no stale number": if the build output size appears
        # nowhere in docs/ or README.md, the docs are quoting something that is no longer
        # true and the build is the thing that moved.
        run: |
          size=$(stat -c%s app/build/outputs/apk/release/app-release.apk)
          if ! grep -rqF "$size" docs/ README.md; then
            echo "::error::no doc quotes the real release APK size ($size bytes)."
            echo "::error::run 'find app/build/outputs -name app-release.apk' and update every"
            echo "::error::APK size figure in docs/ and README.md to match."
            grep -rnE '[0-9]{1,3}(,[0-9]{3})+ bytes|[0-9.]+ MB (debug|release)|release APK is' docs/ README.md || true
            exit 1
          fi
          echo "release APK size $size bytes is quoted in the docs, and it is the current one"

      - name: Upload the release APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release-unsigned
          path: app/build/outputs/apk/release/app-release.apk
          retention-days: 14