# Runs the same three gates the project already uses locally.
#
# WHY THIS EXISTS
# ---------------
# `check_offline.sh` and `check_docs.py` are gates, not documentation. A gate nobody runs is a
# comment. Both have been verified against negative controls -- each catches a deliberately
# broken input -- but until now they only ran when a human remembered, which is exactly the
# condition under which the no-INTERNET property quietly regresses.
#
# The test task is the same one the README documents. Nothing here is a new standard; this
# just makes the existing ones non-optional.

name: gates

on:
  push:
    branches: [ master, main ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4
        with:
          # REQUIRED, not optional. `actions/checkout` leaves LFS-tracked files as 130-byte
          # pointers unless told otherwise, so without this the build packages a 130-byte
          # stand-in for a 153 MB model: `assembleRelease` still succeeds, the APK is 36 MB
          # instead of 187 MB, and every gate downstream is comparing against an artifact no
          # user will ever install.
          #
          # The cost is a 153 MiB download on each run. That is the price of CI building the
          # same thing a person who clones the repository builds, which is the only version
          # of this project worth gating.
          lfs: true

      - name: The LFS model is present, not a pointer file
        # A pointer file is a valid text file, so every later step would pass while the app
        # being tested has no model. Fail loudly and immediately instead of three steps later
        # with a confusing number.
        run: |
          set -eu
          dir=app/src/main/assets/models/whisper-base
          for f in base-encoder.int8.onnx base-decoder.int8.onnx; do
            size=$(stat -c%s "$dir/$f")
            if [ "$size" -lt 1000000 ]; then
              echo "::error::$f is $size bytes -- that is an LFS pointer, not the model."
              echo "::error::Check that actions/checkout still has 'lfs: true'."
              exit 1
            fi
            echo "$f present ($size bytes)"
          done

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle.kts', 'gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Write local.properties
        # gitignored on purpose, so it is absent here exactly as it is absent for any other
        # person who clones. Creating it proves the build does not secretly depend on a file
        # that only exists on the author's machine.
        run: |
          mkdir -p "$ANDROID_HOME"
          echo "sdk.dir=$ANDROID_HOME" > local.properties

      - name: Unit tests (debug and release variants)
        run: ./gradlew --no-daemon --console=plain testDebugUnitTest testReleaseUnitTest

      - name: Build the release, debug and androidTest APKs
        # BOTH, deliberately. `check_offline.sh` refuses to report PASS from a release build
        # alone: without the debug APK there is no evidence the check can detect an INTERNET
        # permission at all, so it exits 2 (INCONCLUSIVE) rather than claiming a pass it has
        # not earned. That is the negative control, and a negative control that is skipped is
        # indistinguishable from a gate that is broken.
        #
        # The first CI run discovered this by failing, which is the control working as designed:
        # it declined to certify the no-INTERNET property on incomplete evidence.
        # `assembleDebugAndroidTest` is here for the size gate below, which checks all three
        # APKs. Building the test APK costs a few seconds and buys a table row that is actually
        # verified rather than remembered.
        run: ./gradlew --no-daemon --console=plain assembleRelease assembleDebug assembleDebugAndroidTest

      - name: Documentation gate
        run: python scripts/check_docs.py --verbose

      - name: Offline gate (release APK has no INTERNET)
        run: bash scripts/check_offline.sh

      - name: Fail if any log line leaks a real device identifier
        # The repository deliberately publishes no Bluetooth MAC and no device serial; the
        # transcripts in docs/ use synthetic addresses. This keeps them synthetic.
        run: |
          if grep -rInE '\b([0-9A-Fa-f]{2}:){5}[0-9A-Fa-f]{2}\b' \
               --include='*.md' --include='*.kt' . \
             | grep -vE '00:11:22:33:44:55|AA:BB:CC:DD:EE:FF'; then
            echo "::error::a real-looking MAC address is present in the repository"
            exit 1
          fi

      - name: R8 is actually enabled, and the speech model is packaged exactly once
        # WHAT CHANGED AND WHY
        # -----------------------
        # This step used to be a single line: assert the release APK is under 4 MiB, on the
        # reasoning that "if minification silently switches off, the APK grows by an order of
        # magnitude". That heuristic stopped working the moment a 153 MB Whisper model was
        # bundled into the APK, because the size is now dominated by an asset that R8 does not
        # touch. Switching minification off no longer produces an order-of-magnitude change --
        # it produces a few megabytes. The old check would have failed on the correct build and
        # stayed silent on the broken one, which is the worst combination a gate can have.
        #
        # So the property is asserted directly instead of being inferred from a number:
        #   1. isMinifyEnabled is genuinely true in the release build type.
        #   2. Each model file appears exactly once in the APK. Duplicated assets are the
        #      realistic way this artifact doubles, and this catches it.
        #   3. A loose absolute ceiling, as a backstop against anything unanticipated.
        run: |
          set -eu
          apk=app/build/outputs/apk/release/app-release.apk

          if ! grep -A6 'release {' app/build.gradle.kts | grep -q 'isMinifyEnabled = true'; then
            echo '::error::isMinifyEnabled is not true in the release build type'
            exit 1
          fi
          echo 'R8 minification is enabled'

          for f in base-encoder.int8.onnx base-decoder.int8.onnx base-tokens.txt; do
            n=$(unzip -l "$apk" | grep -c "$f" || true)
            if [ "$n" -ne 1 ]; then
              echo "::error::$f appears $n times in the release APK, expected exactly 1"
              exit 1
            fi
          done
          echo 'each speech model file is packaged exactly once'

          # 320 MiB. The model plus the two native libraries is ~186 MiB stored uncompressed;
          # this leaves room for app code and resources to grow without tripping, and is still
          # far below the ~2x that an accidental second copy of the model would produce.
          size=$(stat -c%s "$apk")
          echo "release APK: $size bytes"
          if [ "$size" -gt 335544320 ]; then
            echo "::error::release APK is $size bytes, expected under 320 MiB"
            exit 1
          fi

      - name: Executable scripts are executable and have LF shebangs
        # The same class of bug as the tokens file, found the same way: a global convenience rule
        # that is right for almost every file and wrong for a few.
        #
        # `gradlew` was checked out with CRLF, which turned its shebang into `#!/usr/bin/env
        # bash\r`. The kernel then looked for an executable named `bash\r` and every CI run
        # died with `env: 'bash\r': No such file or directory` -- a message that points at the
        # wrong thing entirely, and it took a run to find rather than a glance.
        #
        # The local working copy was LF throughout, so nothing on the author's machine could
        # have shown this. It is only visible in a checkout, which is why it is checked in a
        # checkout.
        run: |
          set -eu

          # 1. gradlew must carry the executable bit.
          mode=$(git ls-files -s gradlew | cut -d' ' -f1)
          if [ "$mode" != "100755" ]; then
            echo "::error::gradlew has mode $mode, expected 100755"
            echo '::error::Run: git update-index --chmod=+x gradlew'
            exit 1
          fi
          echo "gradlew is mode $mode"

          # 2. Nothing with a shebang may contain a CR anywhere on its first line.
          failed=0
          for f in gradlew $(git ls-files '*.sh'); do
            if head -c 200 "$f" | head -n 1 | grep -qU $'\r'; then
              echo "::error::$f has a CR in its shebang line"
              echo '::error::Check .gitattributes -- it needs eol=lf for this path.'
              failed=1
            fi
            # 3. And it must not contain CRs at all: a shell script with CRLF breaks on
            #    line continuations and inside [ ] comparisons, not just in the shebang.
            if grep -qU $'\r' "$f"; then
              echo "::error::$f contains carriage returns"
              echo '::error::Check .gitattributes -- it needs eol=lf for this path.'
              failed=1
            fi
          done
          if [ "$failed" -ne 0 ]; then
            exit 1
          fi
          echo 'every shebang script is LF-only'

      - name: The model files are byte-exact in the checkout
        # WHY THIS EXISTS
        # -------------
        # `.gitattributes` had a blanket `*.txt text eol=crlf` rule. That is correct for prose
        # and it silently corrupted `base-tokens.txt`: the file has 50,257 lines, so a CRLF
        # checkout rewrites it from 816,730 bytes to 866,987. The blob in git was fine, the
        # file in the author's working copy was fine, and `assembleRelease` succeeded --
        # so every local check passed while every fresh clone received a tokens file that
        # `ModelStore` rejects on SHA-256. On a clean clone the app would extract the model,
        # fail verification, discard it as corrupt, and have no speech engine at all.
        #
        # The failure was only found by cloning the published repository and comparing sizes.
        # This step makes that check routine, and it checks the *checked-out* bytes rather
        # than the blob, because the blob was never the thing that was wrong.
        #
        # The expected values are duplicated from ModelStore.EXPECTED on purpose. If they
        # diverge, this gate fails and someone reads the diff -- which is the correct outcome
        # for a model hash that changed without anyone meaning it to.
        run: |
          set -eu
          dir=app/src/main/assets/models/whisper-base
          check() {
            actual=$(sha256sum "$dir/$1" | cut -d' ' -f1)
            actual_size=$(stat -c%s "$dir/$1")
            if [ "$actual" != "$2" ] || [ "$actual_size" != "$3" ]; then
              echo "::error::$1 is $actual_size bytes / $actual"
              echo "::error::expected $3 bytes / $2"
              echo '::error::A mismatch here means a fresh clone cannot load the model.'
              echo '::error::Check .gitattributes for an end-of-line rule touching this file.'
              exit 1
            fi
            echo "$1 ok ($actual_size bytes)"
          }
          check base-tokens.txt   b34b360dbb493e781e479794586d661700670d65564001f23024971d1f2fa126 816730
          check base-encoder.int8.onnx 0b8fb1304b6109976038efff5ace81720e00386f3ff6b54ee8c75291ca0a1e11 29120534
          check base-decoder.int8.onnx 9759d217388a01b3a4c7c15533201067b48ae819c4daafc8624e64b9409dc02d 130672026

      - name: The committed .docx matches its Markdown source
        # The presentation pack is submitted as a Word document, and it was previously built by
        # hand. It drifted: the Markdown was corrected several times while the .docx kept
        # describing an older version of the project, including before offline speech-to-text
        # existed at all. Nothing noticed, because nothing compared the two.
        #
        # `make_docx.py` writes a ZIP with fixed member timestamps, so an unchanged source
        # produces a byte-identical file and `git diff --exit-code` is a valid freshness check.
        run: |
          set -eu
          python scripts/make_docx.py
          if ! git diff --exit-code -- docs/PRESENTATION.docx | head -1 | grep -q .; then
            echo 'PRESENTATION.docx is current'
          else
            echo '::error::docs/PRESENTATION.docx is stale.'
            echo '::error::Run: python scripts/make_docx.py && git add docs/PRESENTATION.docx'
            git diff --stat -- docs/PRESENTATION.docx
            exit 1
          fi

      - name: The APK sizes the docs quote match this build
        # This exists because the docs were wrong. Six files quoted an APK size, the number
        # drifted as the build changed, and nothing noticed: the size was a hand-copied figure
        # with no gate behind it. A reader comparing the README against a fresh build would
        # have found a mismatch, which is exactly the kind of small inaccuracy that makes a
        # project read as careless rather than rigorous.
        #
        # The rule is stricter than "no stale number": for each artifact, if no figure in
        # docs/ or README.md that mentions that artifact falls near the size this build
        # produced, the docs are describing an artifact that no longer exists.
        #
        # WHY ONE CHECK PER ARTIFACT, KEYED TO ITS OWN LABEL
        # ----------------------------------------------------
        # The first version of this step asked only one question -- does *any* number anywhere
        # in the docs land near the release size -- and it passed while the debug and androidTest
        # figures were both stale by tens of thousands of bytes. A single global question cannot
        # hold three separate facts: it is satisfied by whichever artifact happens to still be
        # correct, and says nothing about the other two. So each APK is now checked on its own,
        # and only against lines that actually name it. That is the defect this step found in
        # its own previous form, which is why it is written down here.
        #
        # WHY A TOLERANCE AND NOT AN EXACT MATCH
        # --------------------------------------
        # This originally required one exact byte count to appear in the docs. It ran on
        # ubuntu-latest against a build made on Windows, and an APK is not guaranteed to be
        # byte-identical across hosts -- R8 output and the ART baseline profile can both vary
        # with toolchain details. A gate that fails on a correct build is worse than no gate,
        # because it trains people to ignore red.
        #
        # So the check accepts any quoted figure within 5% of the real size. That still catches
        # every failure actually observed here -- the docs previously said 1,364,843 against a
        # real 196,624,703, which is off by a factor of 144, not by a rounding error -- while
        # surviving an incidental difference between build hosts.
        #
        # A NOTE ON THE SMALLER ARTIFACTS, HONESTLY
        # -----------------------------------------
        # 5% of the release APK is about 9.8 MB of slack. 5% of the 748 KB androidTest APK is
        # 37 KB. The same percentage is a far weaker guarantee on the small artifact, so if this
        # step ever fails on the androidTest row alone, suspect cross-host variation before
        # concluding the docs are stale -- compare the two builds on the same host first. Widen
        # the tolerance with a recorded reason rather than pre-emptively, because the previous
        # defects this step was written to catch were off by factors of 10 and 144, not by
        # tens of kilobytes.
        run: |
          set -eu

          # $1 artifact label, $2 apk path, $3 case-insensitive label to match in the docs
          check_size () {
              label="$1"; apk="$2"; needle="$3"

              if [ ! -f "$apk" ]; then
                  echo "::error::$label APK not found at $apk"
                  return 1
              fi

              size=$(stat -c%s "$apk")
              tol=$((size / 20))
              lo=$((size - tol))
              hi=$((size + tol))
              echo ""
              echo "$label: $size bytes; accepting a quoted figure in [$lo, $hi]"

              # Only figures on lines that name this artifact count. `|| true` because grep
              # exits 1 on no match, which is a legitimate state here, not a script error.
              # The figure pattern requires at least one comma group, so it can pick up a
              # six-digit figure like 748,175 as well as a nine-digit one. An earlier version
              # of this step demanded two or more groups, which silently made the androidTest
              # check unsatisfiable: that APK is under a megabyte, so its size can never have
              # two comma groups and the check failed no matter what the docs said. A gate
              # that cannot pass is worse than no gate, and only running it against a known
              # build caught that.
              quoted=$(grep -rhiE "$needle" docs/ README.md \
                        | grep -oE '[0-9]{1,3}(,[0-9]{3})+' | tr -d ',' || true)

              hit=0
              for n in $quoted; do
                  if [ "$n" -ge "$lo" ] && [ "$n" -le "$hi" ]; then
                      echo "  matched: $n"
                      hit=1
                  fi
              done

              if [ "$hit" -ne 1 ]; then
                  echo "::error::no document quotes a $label APK size near $size."
                  echo "::error::The docs are stale. Update every $label APK size figure in docs/ and README.md."
                  echo "::error::lines mentioning '$needle' that quote a byte count:"
                  grep -rnhiE "$needle" docs/ README.md \
                      | grep -E '[0-9]{1,3}(,[0-9]{3})+ bytes' | sed 's/^/    /' || true
                  return 1
              fi
              echo "  the docs quote a $label APK size that matches this build"
          }

          rc=0
          check_size "release" app/build/outputs/apk/release/app-release.apk 'release' || rc=1
          check_size "debug" app/build/outputs/apk/debug/app-debug.apk 'debug' || rc=1
          # Note the `androidTest/debug/` segment: Gradle nests the test APK under the
          # variant it was built for, unlike release and debug which sit directly in their
          # own directory. Guessing this path wrong is an easy way to make this step fail
          # for a reason that has nothing to do with the docs.
          check_size "androidTest" \
              app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk 'androidtest' || rc=1

          if [ "$rc" -ne 0 ]; then
              echo ""
              echo "::error::at least one APK size in the docs does not match this build"
              exit 1
          fi

      - name: Upload the release APK
        # Named for what it actually is. `assembleRelease` is configured with
        # `signingConfig = signingConfigs.getByName("debug")`, and `apksigner verify` confirms a
        # v2 signature from the Android Debug certificate. Calling it "unsigned" would be a
        # false name on the one artifact a reviewer is most likely to download and trust.
        #
        # It is not production-signed and must not be shipped. The name says so, because a
        # debug-signed release APK is otherwise indistinguishable from a real one by filename.
        uses: actions/upload-artifact@v4
        with:
          name: app-release-debug-signed-not-for-distribution
          path: app/build/outputs/apk/release/app-release.apk
          retention-days: 14